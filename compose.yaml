
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"            # 1. Port du backend sur l'hôte
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend           # 2. Dossier du frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"              # 3. Port du frontend sur l'hôte
    depends_on:
      - backend                  # 4. Service à démarrer avant le frontend
    restart: unless-stopped

