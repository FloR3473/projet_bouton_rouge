name: CI
run-name: "CI - ${{ github.ref_name }} - ${{ github.sha }}"

on:
  push:
    branches:
      - dev

jobs:
  test-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installation des dépendances
        working-directory: ./backend
        run: npm ci

      - name: Lancement des tests
        working-directory: ./backend
        run: npm test

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-backend:latest \
            ./backend

          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-frontend:latest \
            ./frontend

      - name: Push vers Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-backend:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-frontend:latest