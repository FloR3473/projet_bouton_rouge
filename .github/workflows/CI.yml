name: CI
run-name: "CI - ${{ github.ref_name }} - ${{ github.sha }}"

on:
  push:
    branches:
      - dev

jobs:
  verify :
    name : Audit et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # GITLEAKS
      - name: Détecter les secrets exposés
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # BACKEND
      - name: Installer les dépendances backend
        working-directory: backend
        run: npm ci

      - name: Audit sécurité backend - production
        working-directory: backend
        run: npm audit --omit=dev

      - name: Audit complet backend (informatif)
        working-directory: backend
        run: npm audit
        continue-on-error: true

      - name: Tester le backend
        working-directory: backend
        run: npm test

      # FRONTEND
      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Audit sécurité frontend - production
        working-directory: frontend
        run: npm audit --omit=dev

  publish:
    name: Construire et publier les images Docker
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # BUILD
      - name: Build de l'image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-backend:staging \
            ./backend

          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-frontend:staging \
            ./frontend


      # HEALTHCHECKS
      - name: Tester les healthchecks des conteneurs
        run: |
          set -e

          docker network create bouton-rouge-network

          cleanup() {
            docker rm -f backend frontend 2>/dev/null || true
            docker network rm bouton-rouge-network 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run -d \
            --name backend \
            --network bouton-rouge-network \
            --network-alias backend \
            -p 3000:3000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-backend:${{ github.sha }}

          docker run -d \
            --name frontend \
            --network bouton-rouge-network \
            -p 4200:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-frontend:${{ github.sha }}

          check_health() {
            container="$1"

            for i in $(seq 1 30); do
              status=$(docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "$container")

              if [ "$status" = "healthy" ]; then
                echo "$container est healthy"
                return 0
              fi

              if [ "$status" = "unhealthy" ] || [ "$status" = "missing" ]; then
                echo "Échec du healthcheck : $container ($status)"
                docker logs "$container"
                return 1
              fi

              sleep 2
            done

            echo "Timeout : $container n'est pas healthy"
            docker logs "$container"
            return 1
          }

          check_health backend
          check_health frontend

          echo "Lancement du scan OWASP ZAP..."

          mkdir -p "${RUNNER_TEMP}/zap"
          chmod 777 "${RUNNER_TEMP}/zap"

          docker run --rm \
            --network bouton-rouge-network \
            -v "${RUNNER_TEMP}/zap:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://frontend \
              -r zap-report.html \
              -J zap-report.json


      - name: Archiver les rapports OWASP ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-reports
          path: |
            ${{ runner.temp }}/zap/zap-report.html
            ${{ runner.temp }}/zap/zap-report.json
          if-no-files-found: warn
          retention-days: 14

      # TRIVY
      - name: Scan backend image avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # PUBLICATION
      - name: Push vers Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-frontend:${{ github.sha }}

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-backend:staging
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bouton_rouge-frontend:staging